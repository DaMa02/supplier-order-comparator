<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#16324f">
    <title>Confronto ordini fornitori</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#workspace">Vai al contenuto</a>

    <header class="topbar">
      <div class="topbar__inner">
        <p class="eyebrow">Ordini ai fornitori</p>
        <h1>Confronta e prepara gli ordini</h1>
        <div class="topbar__status" aria-live="polite">
          <span id="mode-badge" class="badge badge--neutral">Caricamento</span>
          <span id="save-status" class="save-status">Preparazione…</span>
          <!-- Excluded from the live region's announcements: `topbar__status`
               is `aria-live` because the badge and save status change while
               working, but the version is static and shouldn't be announced
               as if something just happened. -->
          <span id="versione-pubblicata" class="versione-pubblicata" aria-live="off"></span>
        </div>
      </div>
    </header>

    <nav class="stepper-shell" aria-label="Fasi del lavoro">
      <ol id="stepper" class="stepper"></ol>
    </nav>

    <main id="workspace" class="workspace" tabindex="-1">
      <div id="global-message" class="global-message" aria-live="assertive"></div>
      <!-- No `aria-live` here: `render()` replaces this whole container, so
           any update would look like the entire region changing and get
           read out in full by a screen reader — and during a recompute that
           happens about once a second. Announcements already have their own
           stable elements: `#global-message`, `#toast-region` and
           `#avanzamento-annuncio`, whose text changes in place, which is how
           `aria-live` is meant to be used. -->
      <section id="app">
        <div class="loading-card">
          <span class="spinner" aria-hidden="true"></span>
          <div>
            <strong>Sto leggendo i tuoi documenti</strong>
            <p>Controllo l’elenco del gestionale e i listini dei fornitori.</p>
          </div>
        </div>
      </section>
    </main>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

    <!-- Recompute progress, for anyone who can't see the bar. Stays put and
         only its text changes: a live region created together with its
         content isn't announced by several screen readers. -->
    <p id="avanzamento-annuncio" class="visually-hidden" role="status"></p>

    <noscript>
      <div class="noscript">Il programma di navigazione non permette di usare il comparatore. Attiva l’esecuzione delle pagine interattive e riprova.</div>
    </noscript>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
