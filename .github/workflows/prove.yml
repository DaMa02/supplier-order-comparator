# Tests, on Windows, before the code reaches the machine that runs it.
#
# The installed program self-updates from the default branch on every
# launch (`fetch` + `reset --hard`): there's no human step between a push
# and a wrong order. This is the safety net for that.

name: Prove

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Three pushes in a row don't pay for three runs: the first two cancel
# themselves.
concurrency:
  group: prove-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows — the store's machine
    runs-on: windows-latest
    # The measured suite takes about 6 minutes. The cap covers a stuck step:
    # without it, a hung test would burn through the runner budget on its
    # own.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Launcher script parses without syntax errors
        shell: pwsh
        run: |
          # AVVIA_COMPARATORE.ps1 breaking means "the program doesn't
          # start". No test suite exercises it, and PowerShell isn't
          # available to a Mac-based developer to notice. This at least
          # checks that it parses.
          $rotto = $false
          foreach ($script in @("AVVIA_COMPARATORE.ps1")) {
            $errori = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$null, [ref]$errori)
            if ($errori) {
              Write-Host "[ERRORE] $script non si legge:" -ForegroundColor Red
              $errori | ForEach-Object { Write-Host "  $_" }
              $rotto = $true
            } else {
              Write-Host "[OK] $script"
            }
          }
          if ($rotto) { exit 1 }

      - uses: actions/setup-python@v6
        with:
          # Matches the version installed on the store PC.
          python-version: '3.13'

      - uses: actions/setup-node@v5
        with:
          # Matches the store's version too. Only needed by the writer that
          # patches price lists, which uses Node's standard library only —
          # nothing gets installed.
          node-version: '24'

      - name: Dependencies — only what the store has installed
        # From the file, not typed by hand: if this line and
        # `requirements.txt` ever diverge, CI would test against a version
        # the store doesn't have, unnoticed.
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      # `lxml` is deliberately NOT installed. openpyxl serializes with lxml
      # when available and with xml.etree otherwise, and the two write an
      # empty element differently — a mismatch that has caused tests to fail
      # on the store PC while passing here. This runner needs to match the
      # store, not a developer's machine.
      - name: What we're testing against
        run: |
          python -c "import sys, openpyxl; from openpyxl.xml import LXML; print('Python', sys.version); print('openpyxl', openpyxl.__version__, '| usa lxml:', LXML)"
          node --version

      - name: Test suite
        # Always via `discover`, never a single module: otherwise several
        # test classes get silently skipped.
        run: python -m unittest discover -s tests -p "test_*.py"

  browser:
    name: Ubuntu — the UI click-through tests
    runs-on: ubuntu-latest
    # Measured at a couple of seconds; the cap covers the test server
    # failing to start. Runs on Ubuntu, half the cost of Windows: this job
    # tests the page, not the OS.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Program dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Playwright and its browser
        working-directory: prove-browser
        # `--with-deps` also installs the system libraries chromium needs on
        # a bare runner: without it, the browser starts and dies immediately.
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the tests
        working-directory: prove-browser
        run: npx playwright test

      - name: Trace, on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traccia-prove-browser
          path: prove-browser/test-results/
          retention-days: 7
